name: Rule fixtures

# Cross-platform rule checks on a clean checkout. Manual dispatch keeps macOS
# runner minutes under control; the gate is the same on both hosts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rule-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Rule fixtures preload GDScript only; large LFS art is not needed.
          lfs: false
          persist-credentials: false

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          if [[ "$version" != '4.7.2-stable' ]]; then
            echo "Update the pinned download hashes when changing Godot." >&2
            exit 1
          fi
          base="https://github.com/godotengine/godot/releases/download/$version"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            zip="$RUNNER_TEMP/Godot_v${version}_macos.universal.zip"
            curl --fail --location --retry 3 --retry-delay 5 --output "$zip" \
              "$base/Godot_v${version}_macos.universal.zip"
            echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  $zip" | shasum -a 256 -c -
            unzip -q "$zip" -d "$RUNNER_TEMP/godot-editor"
            editor="$RUNNER_TEMP/godot-editor/Godot.app/Contents/MacOS/Godot"
          else
            zip="$RUNNER_TEMP/Godot_v${version}_win64.exe.zip"
            curl --fail --location --retry 3 --retry-delay 5 --output "$zip" \
              "$base/Godot_v${version}_win64.exe.zip"
            echo "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953  $zip" | sha256sum -c -
            unzip -q "$zip" -d "$RUNNER_TEMP/godot-editor"
            # The console binary forwards headless output to the runner log.
            editor="$RUNNER_TEMP/godot-editor/Godot_v${version}_win64_console.exe"
            # Git Bash does not resolve a drive-letter path it was handed by the
            # runner; convert it to the /d/... form bash and Godot can both use.
            editor="$(cygpath -u "$editor")"
          fi
          test -f "$editor"
          echo "GODOT_PATH=$editor" >> "$GITHUB_ENV"

      - name: Run rule fixtures
        shell: bash
        run: |
          set -euo pipefail
          # A clean checkout holds LFS pointers, not art. Scene fixtures preload
          # fonts and textures, so they cannot even compile without the real
          # files: they run only where the art is present, and the log names each
          # one it skipped instead of silently passing it.
          art=1
          if head -c 8 Game/art/ui/game-icon.png 2>/dev/null | grep -q '^version'; then
            art=0
          fi
          scene_tests=(
            social_panel_scene_test
            room_panel_scene_test
            startup_room_test
            m4_client_scene_test
          )
          skipped=0
          tests=(
            farm_state_test
            farm_store_test
            settings_store_test
            farm_command_test
            world_package_test
            v27_importer_test
            farm_v27_fixtures_test
            # Export/import and the scene-free world share the same storage and
            # command boundary, so both hosts must produce identical results.
            world_transfer_test
            headless_world_runtime_test
            headless_event_schedule_test
            headless_crash_commit_test
            world_lab_test
            # WSS + self-signed certificate + the authentication gate. Both
            # platforms run the same loopback prototype plus a negative TLS case.
            m4_auth_test
            m4_join_test
            world_invite_test
            m4_sync_test
            world_identity_test
            # The event tail a reconnecting member catches up from, plus the
            # broadcast that keeps connected members in step.
            world_tail_test
            # The snapshot a member restores when the tail aged out: the full
            # authority, not just the field view, through the disk validators.
            world_snapshot_test
            # Social records: contact invitations, mutual acceptance, blocks,
            # private/public messages and the bounded visit history.
            social_state_test
            # The same record over a real WSS session: push delivery, block
            # refusal, anonymous refusal and on-disk durability.
            m5_social_test
            # Collaboration grants over a real session: a visitor harvests only
            # the granted field, and revocation or expiry constrains the very
            # next command.
            m5_grant_test
            # The neighbours panel as a view: sections, buttons and the action
            # intents it emits, with no network involved.
            social_panel_scene_test
            # The local player profile: one stable id per installation, a rename
            # that keeps it, and a broken file preserved instead of replaced.
            player_profile_test
            # Bags and gifts: a named harvest belongs to the actor, a gift moves
            # produce in one committed snapshot, and a replayed id does not pay
            # twice or conjure anything out of an empty bag.
            player_bags_test
            # Opt-in theft: a named sow owns the cell, another member is refused
            # until the owner opens it, and the daily cap and cooldown hold.
            player_theft_test
            # The same gift over a real session: harvest, gift, replay the id,
            # then an insufficient follow-up, and the recipient's restored bag.
            m5_gift_test
            # One pasted join code carries endpoint, pinned certificate and
            # invitation; a client that cannot parse it says why before dialing.
            world_join_code_test
            # The member roster pushed on join and leave, over a real session.
            m4_presence_test
            # The real farm scene attached to a real authority: join, render,
            # harvest through the authority and refuse local-only edits.
            m4_client_scene_test
            # Stop-write and handover: a retired authority must refuse commands
            # from peers it already accepted, and the successor continues the
            # moved state under a signed generation descriptor.
            m4_move_test
            # The deployable authority entry point: start, join, restart, retire,
            # and refuse bad options. Runs the real server script as a subprocess.
            m4_server_test
            # A room opened by the game itself: spawn the authority, wait for its
            # status file, build the join code from its material, join it and
            # stop it. Proves the desktop path without a hand-written command.
            m4_hosting_test
            # The join/host panel as a view: it turns pastes and clicks into
            # intents and decides nothing about the world.
            room_panel_scene_test
            # The whole room path from the loading screen: open the panel, host a
            # room, enter it and assemble a remote farm, then close the room.
            startup_room_test
            # A lost authority is retried with backoff and the client rejoins the
            # restarted server with a fresh authoritative summary; a first join
            # that is refused is reported instead of retried forever.
            m4_reconnect_test
            # A committed change tells neighbours who did it: the broadcast
            # carries the actor's player id and display name.
            m4_activity_test
          )
          failed=0
          for name in "${tests[@]}"; do
            if (( art == 0 )) && [[ " ${scene_tests[*]} " == *" $name "* ]]; then
              echo "$RUNNER_OS $name skipped=no-art"
              skipped=$(( skipped + 1 ))
              continue
            fi
            script="$PWD/tests/$name.gd"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              script="$(cygpath -w "$script")"
            fi
            log="$RUNNER_TEMP/$name.log"
            # A fixture that waits on a peer that never answers must not consume
            # the whole job: kill it after its own budget and name it in the log.
            "$GODOT_PATH" --headless --path Game --script "$script" >"$log" 2>&1 &
            test_pid=$!
            # A fixture that waits on a peer that never answers must not consume
            # the whole job. A watchdog kills it after its own budget; the marker
            # file says the exit code came from us, not from the fixture.
            marker="$RUNNER_TEMP/$name.timeout"
            rm -f "$marker"
            (
              sleep 180
              : > "$marker"
              kill -TERM "$test_pid" 2>/dev/null || true
              sleep 3
              kill -KILL "$test_pid" 2>/dev/null || true
            ) &
            watchdog=$!
            status=0
            wait "$test_pid" || status=$?
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            if [[ -f "$marker" ]]; then
              echo "FAILED $name (timeout after 180s)" >&2
              tail -60 "$log" >&2
              failed=1
              continue
            fi
            if (( status != 0 )); then
              echo "FAILED $name (exit $status)" >&2
              tail -60 "$log" >&2
              failed=1
              continue
            fi
            if grep -q 'SCRIPT ERROR' "$log"; then
              echo "FAILED $name (script error)" >&2
              tail -60 "$log" >&2
              failed=1
              continue
            fi
            summary="$(grep -E '_TEST checks=' "$log" | tail -1 || true)"
            echo "$RUNNER_OS $name ${summary:-completed}"
          done
          echo "$RUNNER_OS rule fixtures: ${#tests[@]} listed, $skipped skipped for missing art"
          exit "$failed"
