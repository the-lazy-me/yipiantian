name: Rule fixtures

# Cross-platform rule checks on a clean checkout. Manual dispatch keeps macOS
# runner minutes under control; the gate is the same on both hosts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rule-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Rule fixtures preload GDScript only; large LFS art is not needed.
          lfs: false
          persist-credentials: false

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          if [[ "$version" != '4.7.2-stable' ]]; then
            echo "Update the pinned download hashes when changing Godot." >&2
            exit 1
          fi
          base="https://github.com/godotengine/godot/releases/download/$version"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            zip="$RUNNER_TEMP/Godot_v${version}_macos.universal.zip"
            curl --fail --location --retry 3 --retry-delay 5 --output "$zip" \
              "$base/Godot_v${version}_macos.universal.zip"
            echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  $zip" | shasum -a 256 -c -
            unzip -q "$zip" -d "$RUNNER_TEMP/godot-editor"
            editor="$RUNNER_TEMP/godot-editor/Godot.app/Contents/MacOS/Godot"
          else
            zip="$RUNNER_TEMP/Godot_v${version}_win64.exe.zip"
            curl --fail --location --retry 3 --retry-delay 5 --output "$zip" \
              "$base/Godot_v${version}_win64.exe.zip"
            echo "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953  $zip" | sha256sum -c -
            unzip -q "$zip" -d "$RUNNER_TEMP/godot-editor"
            # The console binary forwards headless output to the runner log.
            editor="$RUNNER_TEMP/godot-editor/Godot_v${version}_win64_console.exe"
            # Git Bash does not resolve a drive-letter path it was handed by the
            # runner; convert it to the /d/... form bash and Godot can both use.
            editor="$(cygpath -u "$editor")"
          fi
          test -f "$editor"
          echo "GODOT_PATH=$editor" >> "$GITHUB_ENV"

      - name: Run rule fixtures
        shell: bash
        run: |
          set -euo pipefail
          # A clean checkout holds LFS pointers, not art. Scene fixtures preload
          # fonts and textures, so they cannot even compile without the real
          # files: they run only where the art is present, and the log names each
          # one it skipped instead of silently passing it.
          art=1
          if head -c 8 Game/art/ui/game-icon.png 2>/dev/null | grep -q '^version'; then
            art=0
          fi
          scene_tests=(
            social_panel_scene_test
            room_panel_scene_test
            startup_room_test
            m4_client_scene_test
            single_player_nature_scene_test
            build_panel_test
            market_panel_test
            bank_panel_test
          )
          skipped=0
          tests=(
            farm_state_test
            farm_store_test
            settings_store_test
            farm_command_test
            world_package_test
            v27_importer_test
            farm_v27_fixtures_test
            # Export/import and the scene-free world share the same storage and
            # command boundary, so both hosts must produce identical results.
            world_transfer_test
            headless_world_runtime_test
            headless_event_schedule_test
            # The natural-time slice: the weather sequence is a pure function of
            # a persisted seed, so a reload, a one-shot advance and a stepped
            # advance all agree and none of them draws a new roll.
            nature_state_test
            # Rain and soil moisture: weather blocks drain or refill one bounded
            # value, and a stepped advance settles exactly like one-shot.
            rain_moisture_test
            # Gentle-mode disasters: the same persisted seed derives drought and
            # storm blocks, they only shift moisture, and a version 1 seed still
            # loads with its weather history intact.
            disaster_test
            # The world-level disaster switch: gentle is the default and keeps
            # the old two-key document, off stops future events without touching
            # settled moisture, and the optional mode round trips through JSON.
            disaster_toggle_test
            # M6 integration acceptance: fixed seed, fixed UTC start, single
            # player vs authority block by block, cross-season, a 60-day offline
            # span, a block-boundary maturity action and warning/settlement parity.
            nature_integration_test
            # Weather presentation: the rain emitter's bounded, idempotent state
            # and the overcast mood blended into the clock, with no rendered frame.
            weather_atmosphere_test
            # Residents read the same rain kind: the pure shelter-goal rule
            # picks a deterministic, reachable point inside each bird's own
            # navigation space with no RNG, clock or art.
            animal_weather_routine_test
            # Disaster visibility: the HUD copy and the reversible scene cue are
            # pure data; a warning never reaches the lights or the rain emitter.
            disaster_presentation_test
            # Real main.tscn: weather, soil and disaster HUD lines follow the
            # same nature view the single-player settle path uses. Needs art.
            single_player_nature_scene_test
            headless_crash_commit_test
            world_lab_test
            # WSS + self-signed certificate + the authentication gate. Both
            # platforms run the same loopback prototype plus a negative TLS case.
            m4_auth_test
            m4_join_test
            world_invite_test
            m4_sync_test
            world_identity_test
            # The event tail a reconnecting member catches up from, plus the
            # broadcast that keeps connected members in step.
            world_tail_test
            # The snapshot a member restores when the tail aged out: the full
            # authority, not just the field view, through the disk validators.
            world_snapshot_test
            # Social records: contact invitations, mutual acceptance, blocks,
            # private/public messages and the bounded visit history.
            social_state_test
            # The same record over a real WSS session: push delivery, block
            # refusal, anonymous refusal and on-disk durability.
            m5_social_test
            # Collaboration grants over a real session: a visitor harvests only
            # the granted field, and revocation or expiry constrains the very
            # next command.
            m5_grant_test
            # The neighbours panel as a view: sections, buttons and the action
            # intents it emits, with no network involved.
            social_panel_scene_test
            # The local player profile: one stable id per installation, a rename
            # that keeps it, and a broken file preserved instead of replaced.
            player_profile_test
            # Bags and gifts: a named harvest belongs to the actor, a gift moves
            # produce in one committed snapshot, and a replayed id does not pay
            # twice or conjure anything out of an empty bag.
            player_bags_test
            # Produce ownership: a named harvest lands in the actor's bag, the
            # kitchen, animals and neighbour baskets read that same pocket
            # instead of the shared inventory, and anonymous play is unchanged.
            pantry_test
            # Economy initial conditions: a fixed six-good catalogue, one-time
            # opening grants, a demo conversion that never stacks, and a ledger
            # that replay and restart cannot turn into a second issuance.
            economy_initial_test
            # Double-entry ledger: every cash path posts a balanced entry, the
            # checkpoints reconcile to issued cash, evicted entries keep the
            # checkpoints honest, and a tampered snapshot is refused.
            ledger_test
            # M8-02 rule bank: one-time capital, fixed-fee fixed-term loans,
            # full repayment and an overdue sweep that never compounds, with
            # bank cash reconciled into the same total_cash/issued equation.
            loan_test
            # Market orders: escrowed goods/cash instead of a frozen-balance
            # mirror, deterministic UTC expiry, replay after ledger eviction and
            # a rule merchant whose budget is the only source of its cash.
            market_orders_test
            # Market matching and settlement: price-time priority on both
            # sides, maker pricing, partial fills, a fixed fee burn, atomic
            # goods/cash delivery and durable trade ids that survive the
            # bounded command window and a restart.
            market_matching_test
            # Limited logistics: two fixed markets, in-transit goods that cannot
            # be sold twice, a flat burned shipping fee, deterministic arrival,
            # durable delivery ids, and independence from matching, cancel and
            # expiry.
            market_logistics_test
            # Supply and demand experiments over the real rules: conservation,
            # fee burns, hoarding, thin books, merchant spread, freight loops,
            # self-sufficiency without a market and the 256-order cap.
            market_supply_demand_test
            # Merchant liquidity: a one-time stock grant, a fixed two-sided
            # spread, and rolling quotes that reuse twelve stable rows instead
            # of growing the order table.
            merchant_liquidity_test
            # Archive: a full order/shipment/delivery table evicts the oldest
            # terminal row and keeps a monotonic count, so a long-lived world
            # can keep trading while open and in-transit rows are never lost.
            market_archive_test
            # Stress: bad debt and bank reserve limits, concentrated withdrawal,
            # a merchant drained and refilled, a 60-day offline span whose
            # economic projection matches daily stepping, and a world that
            # never opens a bank or market still growing and cooking.
            m8_stress_test
            # Opt-in theft: a named sow owns the cell, another member is refused
            # until the owner opens it, and the daily cap and cooldown hold.
            player_theft_test
            # Homes are placed on named yard slots: an owner, a build period,
            # demolition, and one winner when two builds race for a slot.
            building_test
            # The yard panel as a view: empty slots, a house under construction,
            # demolition offered only to its owner.
            build_panel_test
            # The market panel as a view: wallet, quotes, order/shipment lists,
            # intent signals, read-only shared worlds and Chinese refusals. It
            # preloads the themed fonts, so it runs only where art is present.
            market_panel_test
            # The shared-world housing view: fixed slot poses that clear the
            # deterministic east-bank planting, an unfinished construction
            # state, demolition, and blueprint sizes. A stub builder keeps it
            # free of LFS art.
            housing_view_test
            # The same gift over a real session: harvest, gift, replay the id,
            # then an insufficient follow-up, and the recipient's restored bag.
            m5_gift_test
            # One pasted join code carries endpoint, pinned certificate and
            # invitation; a client that cannot parse it says why before dialing.
            world_join_code_test
            # The member roster pushed on join and leave, over a real session.
            m4_presence_test
            # The real farm scene attached to a real authority: join, render,
            # harvest through the authority and refuse local-only edits.
            m4_client_scene_test
            # Stop-write and handover: a retired authority must refuse commands
            # from peers it already accepted, and the successor continues the
            # moved state under a signed generation descriptor.
            m4_move_test
            # The deployable authority entry point: start, join, restart, retire,
            # and refuse bad options. Runs the real server script as a subprocess.
            m4_server_test
            # A room opened by the game itself: spawn the authority, wait for its
            # status file, build the join code from its material, join it and
            # stop it. Proves the desktop path without a hand-written command.
            m4_hosting_test
            # The join/host panel as a view: it turns pastes and clicks into
            # intents and decides nothing about the world.
            room_panel_scene_test
            # The whole room path from the loading screen: open the panel, host a
            # room, enter it and assemble a remote farm, then close the room.
            startup_room_test
            # A lost authority is retried with backoff and the client rejoins the
            # restarted server with a fresh authoritative summary; a first join
            # that is refused is reported instead of retried forever.
            m4_reconnect_test
            # Economy commands over a real session: identity comes from the
            # connection, visitors get nothing economic, an old payment sequence
            # stays stale after the bounded command window forgets it, and the
            # authority settles market and loan deadlines on its own clock.
            m4_economy_commands_test
            # The authority economy clock itself: an expired order, a due loan
            # and a no-op sweep, persisted, with crop growth untouched.
            world_economy_clock_test
            # M9-02/03 model boundary: a task is bounded and versioned, a model
            # response is only a suggestion, and a disabled scheduler loads
            # nothing while the world rules keep running.
            ai_task_protocol_test
            model_scheduler_test
            # M9-04 process backend: a fake OS runner covers spawn, async poll,
            # timeout, abort, exit codes and output caps; the real llama.cpp
            # smoke only runs when its environment variables opt in.
            ai_llama_backend_test
            # M10-01 residents: deterministic traits from id + world seed, and a
            # bounded episodic memory whose eviction, retrieval and restored
            # shape stay rules rather than hidden model state.
            npc_memory_test
            # M10-02 residents roster: 林婶/许伯/阿舟 keep stable ids and
            # derived five-dimension traits per world, with seeded baseline
            # memories; the roster is rebuilt, never persisted separately.
            npc_roster_test
            # M11-01 cadastre rules: non-overlapping parcels, claim/transfer/
            # release with durable command ids, and build/trespass permission
            # without touching farm storage or building ownership.
            territory_test
            # A committed change tells neighbours who did it: the broadcast
            # carries the actor's player id and display name.
            m4_activity_test
            # Village Beta: one deployable authority and two real member
            # processes over loopback WSS cover a scoped grant, a build race,
            # an idempotent gift, a clean restart and rejoin.
            village_beta_test
          )
          failed=0
          for name in "${tests[@]}"; do
            if (( art == 0 )) && [[ " ${scene_tests[*]} " == *" $name "* ]]; then
              echo "$RUNNER_OS $name skipped=no-art"
              skipped=$(( skipped + 1 ))
              continue
            fi
            script="$PWD/tests/$name.gd"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              script="$(cygpath -w "$script")"
            fi
            log="$RUNNER_TEMP/$name.log"
            # A fixture that waits on a peer that never answers must not consume
            # the whole job: kill it after its own budget and name it in the log.
            "$GODOT_PATH" --headless --path Game --script "$script" >"$log" 2>&1 &
            test_pid=$!
            # A fixture that waits on a peer that never answers must not consume
            # the whole job. A watchdog kills it after its own budget; the marker
            # file says the exit code came from us, not from the fixture.
            marker="$RUNNER_TEMP/$name.timeout"
            rm -f "$marker"
            (
              sleep 180
              : > "$marker"
              kill -TERM "$test_pid" 2>/dev/null || true
              sleep 3
              kill -KILL "$test_pid" 2>/dev/null || true
            ) &
            watchdog=$!
            status=0
            wait "$test_pid" || status=$?
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            if [[ -f "$marker" ]]; then
              echo "FAILED $name (timeout after 180s)" >&2
              tail -60 "$log" >&2
              failed=1
              continue
            fi
            if (( status != 0 )); then
              echo "FAILED $name (exit $status)" >&2
              tail -60 "$log" >&2
              failed=1
              continue
            fi
            if grep -q 'SCRIPT ERROR' "$log"; then
              echo "FAILED $name (script error)" >&2
              tail -60 "$log" >&2
              failed=1
              continue
            fi
            summary="$(grep -E '_TEST checks=' "$log" | tail -1 || true)"
            echo "$RUNNER_OS $name ${summary:-completed}"
          done
          echo "$RUNNER_OS rule fixtures: ${#tests[@]} listed, $skipped skipped for missing art"
          exit "$failed"
