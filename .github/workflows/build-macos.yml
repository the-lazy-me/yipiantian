name: Build macOS demo

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in Game/project.godot
        required: true
        default: '0.1.8'
        type: string

permissions:
  contents: read

concurrency:
  group: macos-demo-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      # native/macos_desktop/build.sh is the source of truth for the pinned
      # godot-cpp commit, the SCons venv path and the installed dylib names.
      - name: Resolve pinned godot-cpp commit
        id: godot_cpp
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^GODOT_CPP_COMMIT="${GODOT_CPP_COMMIT:-\([0-9a-f]\{40\}\)}"$/\1/p' native/macos_desktop/build.sh)"
          test "${#commit}" -eq 40
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore godot-cpp checkout
        uses: actions/cache@v4
        with:
          path: .local/godot-cpp
          key: ${{ runner.os }}-godot-cpp-${{ steps.godot_cpp.outputs.commit }}

      - name: Install pinned SCons in the build venv
        shell: bash
        run: |
          set -euo pipefail
          # The pinned godot-cpp requires Python >= 3.8 and SCons >= 4.0.
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 8)'
          python3 -m venv .local/tools/venv
          .local/tools/venv/bin/python -m pip install --disable-pip-version-check 'scons==4.11.1'
          .local/tools/venv/bin/scons --version

      - name: Install pinned Godot editor and macOS export templates
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          if [[ "$version" != '4.7.2-stable' ]]; then
            echo "Update the pinned download hashes when changing Godot." >&2
            exit 1
          fi
          base="https://github.com/godotengine/godot/releases/download/$version"
          editor_zip="$RUNNER_TEMP/Godot_v${version}_macos.universal.zip"
          template_tpz="$RUNNER_TEMP/Godot_v${version}_export_templates.tpz"
          curl --fail --location --retry 3 --retry-delay 5 --output "$editor_zip" "$base/Godot_v${version}_macos.universal.zip"
          curl --fail --location --retry 3 --retry-delay 5 --output "$template_tpz" "$base/Godot_v${version}_export_templates.tpz"
          echo "909d40e9ed2b44aadd271bb28a5a93cea4b60bf737b1ea5976706a12cf6dc292  $editor_zip" | shasum -a 256 -c -
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $template_tpz" | shasum -a 256 -c -
          unzip -q "$editor_zip" -d "$RUNNER_TEMP/godot-editor"
          editor="$RUNNER_TEMP/godot-editor/Godot.app/Contents/MacOS/Godot"
          test -x "$editor"
          echo "GODOT_PATH=$editor" >> "$GITHUB_ENV"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/${version//-/.}"
          mkdir -p "$template_dir"
          unzip -j -q "$template_tpz" 'templates/macos.zip' 'templates/version.txt' -d "$template_dir"
          test "$(cat "$template_dir/version.txt")" = "${version//-/.}"

      - name: Verify project version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' Game/project.godot)"
          test "$project_version" = "$RELEASE_VERSION"

      - name: Import, export and package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The build step must run the native build, so never inherit SKIP_NATIVE.
          # GODOT_PATH comes from the pinned editor download above.
          unset SKIP_NATIVE
          scripts/build-macos.sh "$RUNNER_TEMP/macos-build"
          app="$RUNNER_TEMP/macos-build/我有一片田.app"
          test -d "$app"
          # native/macos_desktop/build.sh installs these; a bundle without them
          # would ship a wallpaper mode that silently does nothing. Godot copies
          # the release dylib to Contents/Frameworks and packs the .gdextension
          # into the PCK, so accept either location for the config file.
          dylibs="$(find "$app" -name '*.dylib' -print)"
          if [[ -z "$dylibs" ]]; then
            echo "No GDExtension dylibs found under $app." >&2
            exit 1
          fi
          release_lib="$(find "$app" -name 'macos_desktop.release.dylib' -print -quit)"
          test -n "$release_lib" || { echo "Missing macos_desktop.release.dylib in the bundle." >&2; exit 1; }
          extension="$(find "$app" -name 'macos_desktop.gdextension' -print -quit)"
          if [[ -z "$extension" ]]; then
            pck="$(find "$app" -name '*.pck' -print -quit)"
            if [[ -z "$pck" ]] || ! grep -a -q 'res://native/macos_desktop/macos_desktop.gdextension' "$pck"; then
              echo "Missing macos_desktop.gdextension in the bundle and its PCK." >&2
              exit 1
            fi
          fi
          lipo "$release_lib" -verify_arch arm64 x86_64
          smoke="$app/Contents/MacOS/我有一片田"
          test -x "$smoke"
          "$smoke" --headless --quit-after 1800 > "$RUNNER_TEMP/macos-smoke.log" 2>&1 || {
            tail -80 "$RUNNER_TEMP/macos-smoke.log" >&2
            exit 1
          }
          # A fresh runner has no preferences, so startup stops at the first-run
          # quality choice after the farm scene is already loaded.
          grep -qE 'STARTUP_COMPLETE|STARTUP_CHOICE_READY' "$RUNNER_TEMP/macos-smoke.log"
          # Presence alone does not prove the bundle can resolve the library, so
          # fail on GDExtension load errors instead of shipping a dead feature.
          if grep -qE "Can't open (GDExtension )?dynamic library|Error loading extension" "$RUNNER_TEMP/macos-smoke.log"; then
            grep -E "Can't open (GDExtension )?dynamic library|Error loading extension" "$RUNNER_TEMP/macos-smoke.log" >&2
            echo "The exported bundle could not load the macos_desktop GDExtension." >&2
            exit 1
          fi
          lipo "$smoke" -verify_arch arm64 x86_64

      - name: Upload build manifest and package
        uses: actions/upload-artifact@v4
        with:
          name: yipiantian-macos-${{ inputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/macos-build/version.json
            ${{ runner.temp }}/macos-build/SHA256SUMS.txt
            ${{ runner.temp }}/macos-build/我有一片田.${{ inputs.version }}.macOS.zip
